<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Método Rotina Lucrativa">
  <!--
    Favicon: a própria marca — o boneco com a câmera na cabeça.

    Pastilha escura por baixo de propósito: o ícone da marca é claro, então
    sem a pastilha ele sumiria numa barra de abas branca. Com ela, o mesmo
    arquivo serve no tema claro e no escuro.

    O desenho vem do icone-rotina-lucrativa-dark.svg, no espaço original
    (viewBox 70 50 160 250), reposicionado para caber no quadrado. Se o logo
    mudar, é esse bloco de formas que precisa ser trocado.
  -->
  <defs>
    <filter id="halo" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <radialGradient id="bloom" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#0fd96b" stop-opacity=".42"/>
      <stop offset="1" stop-color="#0fd96b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#141414"/>
  <rect width="64" height="64" rx="14" fill="url(#bloom)"/>

  <!-- A figura é estreita (160×250) num quadrado: sem ocupar quase toda a
       altura, a 16px vira um pontinho. 56 de 64 é o limite antes de a
       silhueta encostar no canto arredondado. -->
  <g transform="translate(14.1 4) scale(0.224) translate(-70 -50)">
    <!-- silhueta verde borrada: é o que dá o contraluz aceso -->
    <g filter="url(#halo)" fill="#0fd96b" opacity=".9">
      <path d="M75 300 L75 281 A75 75 0 0 1 225 281 L225 300 Z"/>
      <circle cx="150" cy="144" r="48"/>
      <rect x="94" y="120" width="112" height="22" rx="11"/>
      <rect x="112" y="56" width="76" height="46" rx="8"/>
    </g>

    <!-- a marca -->
    <path d="M75 300 L75 281 A75 75 0 0 1 225 281 L225 300 Z" fill="#f5f3ec"/>
    <circle cx="150" cy="144" r="48" fill="#f5f3ec"/>
    <rect x="141" y="74" width="22" height="56" rx="11" fill="#5ec99a"/>
    <rect x="94" y="120" width="112" height="22" rx="11" fill="#5ec99a"/>
    <rect x="132" y="96" width="36" height="34" rx="5" fill="#3fa87c"/>
    <rect x="112" y="56" width="76" height="46" rx="8" fill="#5ec99a"/>
    <rect x="118" y="62" width="64" height="34" rx="4" fill="#1c1a15"/>
    <rect x="123" y="66" width="26" height="26" rx="7" fill="#33302a"/>
    <circle cx="130.5" cy="73.5" r="4.5" fill="#5ec99a"/>
    <circle cx="141.5" cy="73.5" r="4.5" fill="#5ec99a"/>
    <circle cx="130.5" cy="84.5" r="4.5" fill="#5ec99a"/>
  </g>
</svg>
